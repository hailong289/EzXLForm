name: Desktop

on:
  push:
    branches: [main, master]
    tags:
      # {năm}.{tháng}.{phiên bản} — ví dụ 2026.10.1
      - "[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-22.04
            artifact: linux
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend
        run: npm ci

      - name: Gán phiên bản từ tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('fs')
          const version = process.env.GITHUB_REF_NAME
          if (!/^\d{4}\.\d+\.\d+$/.test(version)) {
            console.error('Tag phải có dạng năm.tháng.phiên bản, ví dụ 2026.10.1')
            process.exit(1)
          }
          const pkgPath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          pkg.version = version
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')
          const confPath = 'src-tauri/tauri.conf.json'
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'))
          conf.version = version
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n')
          const cargoPath = 'src-tauri/Cargo.toml'
          const cargo = fs.readFileSync(cargoPath, 'utf8').replace(/^version = ".*"/m, `version = "${version}"`)
          fs.writeFileSync(cargoPath, cargo)
          EOF

      - name: Build installer
        if: github.ref_type != 'tag'
        run: npm run tauri build

      - name: Upload installer
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: excel-editor-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/**/*.app/**

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Excel Editor ${{ github.ref_name }}
          releaseBody: "Tải file cài đặt ở phần Assets."
          releaseDraft: false
          prerelease: false
